version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://api.internlog.cc.cd/api}
    container_name: internlog_frontend
    restart: always
    networks:
      - internlog_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: internlog_backend
    restart: always
    volumes:
      - ./backend/.env:/var/www/html/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://api.internlog.cc.cd}
    networks:
      - internlog_network

  nginx:
    image: nginx:alpine
    container_name: internlog_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internlog_network

networks:
  internlog_network:
    driver: bridge
